# Real hardware — same image as sim, different mounts + env
name: r1-real

services:
  robot:
    image: ${R1_SIM_IMAGE:-ghcr.io/your-org/r1/r1-sim:latest}
    container_name: r1_sim        # same name — r1-shell works the same way
    hostname: sim
    init: true
    runtime: ${DOCKER_RUNTIME:-nvidia}
    networks:
      - r1_net
    ports:
      - "7447:7447"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev                   # full device passthrough for cameras, USB, serial
      - /run/udev:/run/udev:ro      # udev for hardware detection
      # Dev mode: live src/ edits reflected without rebuild (Section 12 Req 7)
      # Comment out for runtime mode (src baked into image)
      - ${ROS_WS_PATH}/src:/ros_ws/src:rw
      - ${ROS_WS_PATH}/logs:/logs
    extra_hosts:
      robot: ${ROBOT_IP:-127.0.0.1} # actual robot IP
    environment:
      DISPLAY: ${DISPLAY:-:0}
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_CONFIG_OVERRIDE: ${ZENOH_CONFIG_OVERRIDE}
      R1_ENABLE_ACL: ${R1_ENABLE_ACL:-false}
      R1_SIM_PASSWD: ${R1_SIM_PASSWD:-CHANGE_ME}
      R1_ROBOT_PASSWD: ${R1_ROBOT_PASSWD:-CHANGE_ME}
      ROBOT_IP: ${ROBOT_IP}
      USE_SIM: "false"
      MISO_LOGDIR: /logs
    entrypoint: ["/entrypoint.sh"]
    privileged: true              # needed for hardware access
    restart: unless-stopped
    tty: true

networks:
  r1_net:
    name: r1_net
