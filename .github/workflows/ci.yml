name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to ensure everything still works
    - cron: '0 0 * * 0'

env:
  DOCKER_IMAGE: robotlab-ros
  DOCKER_TAG: latest

jobs:
  # Build and test Docker image
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Test Docker image
        run: |
          # Test that the image can be run
          docker run --rm ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} echo "Container test passed"
          
          # Test ROS environment
          docker run --rm ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} bash -c "source /opt/ros/noetic/setup.bash && roscore --help"
          
          # Test Python packages
          docker run --rm ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} python3 -c "import torch, tensorflow, numpy, cv2; print('All AI packages imported successfully')"

  # Run Python tests
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy

      - name: Lint code
        run: |
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503
          mypy src/ --ignore-missing-imports

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Documentation build
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build documentation
        run: |
          # Check if README exists and is valid
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          
          # Check if PROJECT_SUMMARY.md exists
          if [ ! -f "PROJECT_SUMMARY.md" ]; then
            echo "❌ PROJECT_SUMMARY.md not found"
            exit 1
          fi
          
          echo "✅ Documentation files found"

      - name: Validate markdown
        run: |
          # Basic markdown validation
          if grep -q "TODO\|FIXME" README.md PROJECT_SUMMARY.md; then
            echo "⚠️  Found TODO/FIXME in documentation"
          fi

  # Performance testing
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for performance testing
        run: |
          docker build -t robotlab-test .
          
      - name: Test container startup time
        run: |
          start_time=$(date +%s.%N)
          docker run --rm robotlab-test echo "startup complete"
          end_time=$(date +%s.%N)
          startup_time=$(echo "$end_time - $start_time" | bc)
          echo "Container startup time: ${startup_time}s"
          
          # Fail if startup takes more than 30 seconds
          if (( $(echo "$startup_time > 30" | bc -l) )); then
            echo "❌ Container startup too slow: ${startup_time}s"
            exit 1
          fi
          
          echo "✅ Container startup time acceptable: ${startup_time}s" 