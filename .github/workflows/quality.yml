name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run quality checks weekly
    - cron: '0 1 * * 0'

jobs:
  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install black isort pylint mypy bandit
          pip install -r requirements.txt

      - name: Run Black (code formatting)
        run: |
          black --check --diff src/ tests/

      - name: Run isort (import sorting)
        run: |
          isort --check-only --diff src/ tests/

      - name: Run Pylint
        run: |
          pylint src/ --disable=C0114,C0116 --max-line-length=100

      - name: Run MyPy (type checking)
        run: |
          mypy src/ --ignore-missing-imports --disallow-untyped-defs

      - name: Run Bandit (security linting)
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

  # Test coverage and quality
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-mock pytest-asyncio
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Check coverage threshold
        run: |
          coverage=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(root.attrib['line-rate'])")
          coverage_percent=$(echo "$coverage * 100" | bc -l | cut -d. -f1)
          echo "Coverage: ${coverage_percent}%"
          if [ "$coverage_percent" -lt 80 ]; then
            echo "❌ Coverage below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage meets threshold"

  # Documentation quality
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation completeness
        run: |
          # Check for required documentation files
          required_files=("README.md" "PROJECT_SUMMARY.md" "docs/STRUCTURE.md")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required documentation: $file"
              exit 1
            fi
          done
          echo "✅ All required documentation files present"

      - name: Check README quality
        run: |
          # Check README has required sections
          sections=("Installation" "Usage" "Features")
          for section in "${sections[@]}"; do
            if ! grep -q "## $section" README.md; then
              echo "⚠️  README missing section: $section"
            fi
          done

      - name: Validate markdown
        run: |
          # Check for broken links in markdown
          if command -v markdown-link-check &> /dev/null; then
            markdown-link-check README.md
          fi

  # Performance benchmarks
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t robotlab-quality-test .

      - name: Benchmark container startup
        run: |
          # Measure container startup time
          start_time=$(date +%s.%N)
          docker run --rm robotlab-quality-test echo "startup complete"
          end_time=$(date +%s.%N)
          startup_time=$(echo "$end_time - $start_time" | bc)
          echo "Container startup time: ${startup_time}s"
          
          # Store benchmark results
          echo "startup_time=${startup_time}s" >> $GITHUB_ENV

      - name: Benchmark image size
        run: |
          # Check image size
          image_size=$(docker images robotlab-quality-test --format "{{.Size}}" | sed 's/[^0-9.]//g')
          echo "Image size: ${image_size}MB"
          
          # Fail if image is too large (>2GB)
          if (( $(echo "$image_size > 2048" | bc -l) )); then
            echo "❌ Image too large: ${image_size}MB"
            exit 1
          fi
          echo "✅ Image size acceptable: ${image_size}MB"

  # Dependency health
  dependency-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Check for outdated dependencies
        run: |
          pip install pip-review
          pip-review --local --output=table

      - name: Check for security vulnerabilities
        run: |
          pip install safety
          safety check --json --output safety-report.json || true

      - name: Upload safety report
        uses: actions/upload-artifact@v3
        with:
          name: safety-report
          path: safety-report.json 